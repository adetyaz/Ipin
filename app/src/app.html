<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f3f4f8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e1330"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Ìpín: send money for a purpose. You decide what your money is for, not whoever receives it."
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <script>
      try {
        const t = localStorage.getItem("ipin:theme")
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t
      } catch {
        /* storage blocked: follow the system theme */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
